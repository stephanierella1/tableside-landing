<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableside — Something is Simmering</title>
  <meta name="description" content="Something is simmering. Coming soon to Android and iOS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --linen: #FAF7F2;
      --ink: #1A1C24;
      --ink-light: #2C2E3A;
      --walnut: #2C2822;
      --stone: #A09880;
      --sand: #C0B8AA;
      --warm-wood: #7A6A52;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Jost', sans-serif;
    }

    body {
      background-color: var(--linen);
      color: var(--walnut);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle vignette for drama */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(26,20,16,0.08) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Corner flourishes */
    .corner {
      position: fixed;
      width: 48px;
      height: 48px;
      opacity: 0.15;
      z-index: 10;
      pointer-events: none;
    }
    .corner-tl { top: 28px; left: 28px; border-top: 0.5px solid var(--walnut); border-left: 0.5px solid var(--walnut); }
    .corner-tr { top: 28px; right: 28px; border-top: 0.5px solid var(--walnut); border-right: 0.5px solid var(--walnut); }
    .corner-bl { bottom: 28px; left: 28px; border-bottom: 0.5px solid var(--walnut); border-left: 0.5px solid var(--walnut); }
    .corner-br { bottom: 28px; right: 28px; border-bottom: 0.5px solid var(--walnut); border-right: 0.5px solid var(--walnut); }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Candle */
    .candle-wrap {
      margin-bottom: 40px;
      animation: fadeUp 1.2s 0.1s ease both;
    }

    .candle { display: flex; flex-direction: column; align-items: center; }

    .flame {
      width: 10px;
      height: 18px;
      background: radial-gradient(ellipse at 50% 80%, #F5C842 0%, #E8901A 50%, transparent 100%);
      border-radius: 50% 50% 30% 30%;
      animation: flicker 2.8s ease-in-out infinite alternate;
      filter: blur(0.4px);
      margin-bottom: -1px;
    }

    @keyframes flicker {
      0%   { transform: scaleX(1)    scaleY(1)    rotate(-1deg);   opacity: 0.95; }
      30%  { transform: scaleX(0.9)  scaleY(1.06) rotate(1.5deg);  opacity: 1;    }
      60%  { transform: scaleX(1.06) scaleY(0.96) rotate(-0.5deg); opacity: 0.9;  }
      100% { transform: scaleX(0.96) scaleY(1.02) rotate(1.2deg);  opacity: 0.97; }
    }

    .wick { width: 1.5px; height: 6px; background: var(--walnut); opacity: 0.5; }

    .candle-body {
      width: 16px;
      height: 44px;
      background: linear-gradient(135deg, #F5F0E8 0%, #E8E0D0 50%, #D8D0C0 100%);
      border-radius: 1px;
      box-shadow: inset -2px 0 4px rgba(0,0,0,0.05);
    }

    .candle-base { width: 22px; height: 3px; background: #D8D0C0; border-radius: 0 0 2px 2px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Wordmark */
    .wordmark {
      font-family: var(--serif);
      font-size: clamp(44px, 9vw, 68px);
      font-weight: 300;
      letter-spacing: 0.14em;
      color: var(--walnut);
      line-height: 1;
      animation: fadeUp 1.2s 0.2s ease both;
    }

    .rule {
      width: 36px;
      height: 0.5px;
      background: var(--sand);
      margin: 22px auto 24px;
      animation: fadeUp 1.2s 0.3s ease both;
    }

    /* Main tagline — the ominous one */
    .tagline {
      font-family: var(--serif);
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 400;
      font-style: italic;
      color: var(--walnut);
      line-height: 1.4;
      margin-bottom: 10px;
      animation: fadeUp 1.2s 0.35s ease both;
      letter-spacing: 0.02em;
    }

    /* Secondary line — slightly mysterious */
    .sub-tagline {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 300;
      color: var(--stone);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 2;
      margin-bottom: 50px;
      animation: fadeUp 1.2s 0.42s ease both;
    }

    /* CTA section */
    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 50px;
      animation: fadeUp 1.2s 0.5s ease both;
    }

    .cta-label {
      font-family: var(--serif);
      font-size: clamp(15px, 2.5vw, 18px);
      font-weight: 300;
      font-style: italic;
      color: var(--warm-wood);
      letter-spacing: 0.02em;
    }

    .instagram-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--ink);
      color: var(--linen);
      text-decoration: none;
      padding: 15px 34px;
      border-radius: 2px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .instagram-btn:hover {
      background: var(--ink-light);
      transform: translateY(-1px);
    }

    .instagram-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--linen);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .cta-note {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 300;
      color: var(--sand);
      letter-spacing: 0.06em;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 24px;
      animation: fadeUp 1.2s 0.58s ease both;
    }

    .divider-line { flex: 1; height: 0.5px; background: var(--sand); opacity: 0.6; }

    .divider-text {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sand);
      white-space: nowrap;
    }

    /* Platforms */
    .platforms {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-bottom: 52px;
      animation: fadeUp 1.2s 0.64s ease both;
    }

    .platform {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .platform-icon {
      width: 38px;
      height: 38px;
      border: 0.5px solid var(--sand);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
    }

    .platform-label {
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sand);
    }

    .platform-soon {
      font-family: var(--serif);
      font-style: italic;
      font-size: 11px;
      color: var(--sand);
      opacity: 0.7;
    }

    .footer {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--sand);
      animation: fadeUp 1.2s 0.7s ease both;
    }

    @media (max-width: 480px) {
      .container { padding: 48px 24px; }
      .corner { width: 32px; height: 32px; }
      .corner-tl { top: 16px; left: 16px; }
      .corner-tr { top: 16px; right: 16px; }
      .corner-bl { bottom: 16px; left: 16px; }
      .corner-br { bottom: 16px; right: 16px; }
      .instagram-btn { padding: 14px 24px; }
    }
  </style>
</head>
<body>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <main class="container">

    <div class="candle-wrap">
      <div class="candle">
        <div class="flame"></div>
        <div class="wick"></div>
        <div class="candle-body"></div>
        <div class="candle-base"></div>
      </div>
    </div>

    <h1 class="wordmark">tableside</h1>
    <div class="rule"></div>

    <p class="tagline">Something is simmering.</p>

    <p class="sub-tagline">
      We're not ready to lift the lid just yet.<br>
      Trust us — it'll be worth the wait.
    </p>

    <div class="cta-wrap">
      <p class="cta-label">Consider this your invitation.</p>
      <a
        class="instagram-btn"
        href="https://instagram.com/tableside_app"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4.5"/>
          <circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"/>
        </svg>
        @tableside_app
      </a>
      <p class="cta-note">Slide into our DMs — we'd love to hear from you. 🕯️</p>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">Coming soon to</span>
      <div class="divider-line"></div>
    </div>

    <div class="platforms">
      <div class="platform">
        <div class="platform-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 10h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8z" stroke="#7A6A52" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#7A6A52" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="7" y1="4" x2="5.5" y2="2" stroke="#7A6A52" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="17" y1="4" x2="18.5" y2="2" stroke="#7A6A52" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="platform-label">Android</span>
        <span class="platform-soon">first</span>
      </div>
      <div class="platform">
        <div class="platform-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 7.5C15.5 6 14 5 12.5 5c-1 0-2 .5-2.5.5S8.5 5 7.5 5C5.5 5 3.5 7 3.5 10c0 4 2.5 9 4.5 9 .8 0 1.5-.5 2.5-.5s1.7.5 2.5.5c2 0 4.5-5 4.5-9 0-1-.3-2-.5-2.5z" stroke="#7A6A52" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 3c0 1.5-1 3-2.5 3S9 4.5 9 3c1.5 0 3.5.5 5 0z" stroke="#7A6A52" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="platform-label">iOS</span>
        <span class="platform-soon">soon after</span>
      </div>
    </div>

    <p class="footer">© 2025 Tableside &nbsp;·&nbsp; jointableside.app</p>

  </main>

</body>
</html>
